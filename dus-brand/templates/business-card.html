<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DUS Business Card</title>
  <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,400;0,700;0,900;1,400;1,700&display=swap" rel="stylesheet">
  <style>
    /* ═══════════════════════════════════════════════════════
       DUS Business Card Template
       Canvas: 1050 x 600 px  (3.5 in x 2 in at 300 DPI)
       Export front: --window-size=1050,600  file.html#only-1
       Export back:  --window-size=1050,600  file.html#only-2
       ═══════════════════════════════════════════════════════ */

    :root {
      --teal-900: #012A39;
      --teal-700: #015270;
      --green-500: #41BE48;
      --neutral-900: #1A1A1A;
      --neutral-800: #2D2D2D;
      --neutral-700: #404040;
      --white: #FFFFFF;
      --primary: var(--teal-700);
      --accent: var(--green-500);
      --card-w: 1050px;
      --card-h: 600px;
      --pad-v: 36px;
      --pad-h: 56px;
      --bar-h: 86px;
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Lato', sans-serif;
      background: #d5d5d5;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 48px;
      padding: 48px;
      -webkit-font-smoothing: antialiased;
    }

    .side-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .side-label {
      font-weight: 700;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: var(--neutral-700);
    }

    .canvas {
      width: var(--card-w);
      height: var(--card-h);
      position: relative;
      overflow: hidden;
      border-radius: 18px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.14);
    }

    /* ═══════ FRONT ═══════ */

    .front { background: var(--white); }

    .front-inner {
      position: absolute;
      inset: 0;
      padding: var(--pad-v) var(--pad-h) calc(var(--bar-h) + 16px) var(--pad-h);
      display: flex;
      flex-direction: column;
    }

    .front-header { display: flex; justify-content: flex-end; }

    .front-logo {
      height: 96px;
      width: auto;
      object-fit: contain;
      display: block;
    }

    .front-identity { margin-top: 34px; }

    .front-name {
      font-weight: 900;
      font-size: 64px;
      color: var(--neutral-900);
      line-height: 1.1;
      letter-spacing: -0.01em;
    }

    .front-title {
      font-weight: 700;
      font-size: 32px;
      color: var(--neutral-900);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-top: 6px;
      line-height: 1.2;
    }

    .front-contact {
      margin-top: 28px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .contact-row { display: flex; align-items: center; gap: 16px; }

    .contact-icon {
      width: 34px;
      height: 34px;
      flex-shrink: 0;
      color: var(--accent);
    }

    .contact-text {
      font-weight: 700;
      font-size: 30px;
      color: var(--neutral-900);
      letter-spacing: 0.02em;
    }

    .front-bar {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: var(--bar-h);
      background: linear-gradient(90deg, var(--green-500) 0%, var(--teal-700) 100%);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 var(--pad-h);
    }

    .bar-services {
      font-weight: 700;
      font-size: 18px;
      color: var(--white);
      text-transform: uppercase;
      letter-spacing: 0.10em;
      white-space: nowrap;
    }

    .bar-url {
      font-weight: 700;
      font-size: 18px;
      color: var(--white);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      white-space: nowrap;
    }

    /* ═══════ BACK ═══════ */

    .back {
      background: linear-gradient(90deg, var(--teal-700) 0%, var(--green-500) 100%);
    }

    .back-inner {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 24px;
    }

    .back-logo {
      height: 220px;
      width: auto;
      object-fit: contain;
      display: block;
    }

    .back-mission {
      font-weight: 700;
      font-size: 38px;
      color: var(--white);
      letter-spacing: 0.03em;
      margin-top: 32px;
    }

    .back-values {
      font-weight: 700;
      font-size: 20px;
      color: var(--white);
      text-transform: uppercase;
      letter-spacing: 0.18em;
    }

    /* ═══════ Print ═══════ */
    @media print {
      body { background: none; padding: 0; gap: 0; }
      .side-label { display: none; }
      .canvas { box-shadow: none; border-radius: 0; page-break-after: always; }
    }
  </style>
</head>

  <script>
    // Slide isolation for export: append #only-1 or #only-2 to URL
    (function () {
      var m = location.hash.match(/^#only-(\d+)$/);
      if (!m) return;
      var n = parseInt(m[1], 10);
      var wrappers = document.querySelectorAll('.side-wrapper');
      for (var i = 0; i < wrappers.length; i++) {
        if (i + 1 !== n) {
          wrappers[i].style.display = 'none';
        } else {
          var label = wrappers[i].querySelector('.side-label');
          if (label) label.style.display = 'none';
          document.body.style.padding = '0';
          document.body.style.gap = '0';
          document.body.style.background = 'transparent';
          var canvas = wrappers[i].querySelector('.canvas');
          if (canvas) {
            canvas.style.borderRadius = '0';
            canvas.style.boxShadow = 'none';
          }
        }
      }
    })();
  </script>
